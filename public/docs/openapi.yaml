openapi: 3.0.3
info:
  title: speedNFE API
  version: 1.0.0
  description: API REST versionada para autenticação, cadastros, estoque, financeiro e documentos fiscais.
servers:
  - url: /api/v1
    description: Servidor atual
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Dashboard
  - name: Clientes
  - name: Produtos
  - name: Pre-vendas
  - name: Entradas
  - name: Estoques
  - name: Financeiro
  - name: Fiscal
  - name: Relatorios
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          nullable: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: bearer
        expires_in:
          type: integer
        user:
          type: object
    Cliente:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
        cpf_cnpj:
          type: string
        empresa_id:
          type: integer
    Produto:
      type: object
      properties:
        id:
          type: integer
        produto:
          type: string
        codigo:
          type: string
        ncm:
          type: string
        empresa_id:
          type: integer
    PreVendaItem:
      type: object
      required: [produto_id, quantidade]
      properties:
        produto_id: { type: integer }
        descricao: { type: string, readOnly: true }
        quantidade: { type: number, format: double, minimum: 0.0001 }
        valor_unitario: { type: number, format: double, minimum: 0 }
        desconto: { type: number, format: double, minimum: 0 }
        acrescimo: { type: number, format: double, minimum: 0 }
        total: { type: number, format: double, readOnly: true }
    PreVendaPagamento:
      type: object
      required: [valor]
      properties:
        forma_pag_id: { type: integer, nullable: true }
        descricao: { type: string, nullable: true }
        valor: { type: number, format: double, minimum: 0.01 }
        vencimento: { type: string, format: date, nullable: true }
    PreVenda:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        numero: { type: integer, readOnly: true }
        empresa_id: { type: integer }
        cliente_id: { type: integer, nullable: true }
        cliente_nome: { type: string, nullable: true, readOnly: true }
        cliente_documento: { type: string, nullable: true, readOnly: true }
        data: { type: string, format: date }
        validade_at: { type: string, format: date, nullable: true }
        status:
          type: string
          enum: [ABERTA, CONVERTIDA, CANCELADA, EXPIRADA]
          readOnly: true
        subtotal: { type: number, format: double, readOnly: true }
        desconto: { type: number, format: double, minimum: 0 }
        acrescimo: { type: number, format: double, minimum: 0 }
        total: { type: number, format: double, readOnly: true }
        observacoes: { type: string, nullable: true }
        destino: { type: string, enum: [NFE, NFCE], nullable: true, readOnly: true }
        pedido_id: { type: integer, nullable: true, readOnly: true }
        cupom_id: { type: integer, nullable: true, readOnly: true }
        itens:
          type: array
          items: { $ref: '#/components/schemas/PreVendaItem' }
        pagamentos:
          type: array
          items: { $ref: '#/components/schemas/PreVendaPagamento' }
    StandardMessage:
      type: object
      properties:
        message:
          type: string
  responses:
    Unauthorized:
      description: Token ausente, inválido ou expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Erro de validação.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
paths:
  /auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Autentica usuário e retorna JWT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login efetuado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/me:
    get:
      tags: [Auth]
      summary: Retorna usuário autenticado.
      responses:
        '200':
          description: Usuário atual.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renova o token JWT.
      responses:
        '200':
          description: Novo token.
  /auth/logout:
    post:
      tags: [Auth]
      summary: Invalida o token atual.
      responses:
        '200':
          description: Logout realizado.
  /dashboard:
    get:
      tags: [Dashboard]
      summary: Retorna indicadores do dashboard.
      responses:
        '200':
          description: Indicadores.
  /clientes:
    get:
      tags: [Clientes]
      summary: Lista clientes paginados.
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: per_page
          schema: { type: integer, default: 15, maximum: 100 }
      responses:
        '200':
          description: Lista paginada.
    post:
      tags: [Clientes]
      summary: Cria cliente.
      responses:
        '201':
          description: Cliente criado.
        '422':
          $ref: '#/components/responses/ValidationError'
  /clientes/{id}:
    get:
      tags: [Clientes]
      summary: Detalha cliente.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Cliente.
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Clientes]
      summary: Atualiza cliente.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Cliente atualizado.
    delete:
      tags: [Clientes]
      summary: Remove cliente.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Cliente removido.
  /clientes/consultar-cnpj/{cnpj}:
    get:
      tags: [Clientes]
      summary: Consulta dados públicos de CNPJ.
      parameters:
        - in: path
          name: cnpj
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Dados do CNPJ.
  /clientes/verificar-cpf-cnpj:
    get:
      tags: [Clientes]
      summary: Verifica se CPF/CNPJ já existe.
      parameters:
        - in: query
          name: cpf_cnpj
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Resultado da verificação.
  /produtos:
    get:
      tags: [Produtos]
      summary: Lista produtos paginados.
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: categoria_id
          schema: { type: integer }
        - in: query
          name: per_page
          schema: { type: integer, default: 15, maximum: 100 }
      responses:
        '200':
          description: Lista paginada.
    post:
      tags: [Produtos]
      summary: Cria produto.
      responses:
        '201':
          description: Produto criado.
  /produtos/{id}:
    get:
      tags: [Produtos]
      summary: Detalha produto.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Produto.
    put:
      tags: [Produtos]
      summary: Atualiza produto.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Produto atualizado.
    delete:
      tags: [Produtos]
      summary: Remove produto.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Produto removido.
  /pre-vendas:
    get:
      tags: [Pre-vendas]
      summary: Lista pré-vendas da empresa autenticada.
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [ABERTA, CONVERTIDA, CANCELADA, EXPIRADA] }
        - in: query
          name: data_inicio
          schema: { type: string, format: date }
        - in: query
          name: data_fim
          schema: { type: string, format: date }
      responses:
        '200':
          description: Lista paginada de pré-vendas.
    post:
      tags: [Pre-vendas]
      summary: Cria uma pré-venda sem movimentar estoque ou financeiro.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreVenda'
      responses:
        '201':
          description: Pré-venda criada.
        '422':
          $ref: '#/components/responses/ValidationError'
  /pre-vendas/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      tags: [Pre-vendas]
      summary: Detalha uma pré-venda.
      responses:
        '200':
          description: Pré-venda encontrada.
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Pre-vendas]
      summary: Atualiza uma pré-venda aberta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreVenda'
      responses:
        '200':
          description: Pré-venda atualizada.
        '422':
          $ref: '#/components/responses/ValidationError'
  /pre-vendas/{id}/cancelar:
    post:
      tags: [Pre-vendas]
      summary: Cancela uma pré-venda aberta.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Pré-venda cancelada.
  /pre-vendas/{id}/converter:
    post:
      tags: [Pre-vendas]
      summary: Converte uma pré-venda uma única vez em NF-e ou NFC-e.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [destino]
              properties:
                destino: { type: string, enum: [NFE, NFCE] }
                cfop: { type: integer, description: Obrigatório para NF-e. }
                finalidade: { type: integer, enum: [1, 4] }
                tipo: { type: integer, enum: [0, 1] }
                ref_nfe: { type: string, nullable: true }
                info_complementares: { type: string, nullable: true }
                aut_xml: { type: string, nullable: true }
      responses:
        '200':
          description: Pré-venda convertida.
        '422':
          $ref: '#/components/responses/ValidationError'
  /pre-vendas/{id}/pdf:
    get:
      tags: [Pre-vendas]
      summary: Gera o PDF da pré-venda.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: PDF da pré-venda.
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /entradas:
    get:
      tags: [Entradas]
      summary: Lista entradas de NFe importadas.
      responses:
        '200':
          description: Lista paginada.
  /entradas/{id}:
    get:
      tags: [Entradas]
      summary: Detalha entrada.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Entrada.
    delete:
      tags: [Entradas]
      summary: Remove entrada e ajusta estoque.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Entrada removida.
  /estoques:
    get:
      tags: [Estoques]
      summary: Lista estoques.
      responses:
        '200':
          description: Lista paginada.
  /estoques/{id}:
    get:
      tags: [Estoques]
      summary: Detalha estoque.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Estoque.
    put:
      tags: [Estoques]
      summary: Atualiza estoque.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Estoque atualizado.
  /formas-pagamento:
    get:
      tags: [Financeiro]
      summary: Lista formas de pagamento.
      responses:
        '200':
          description: Lista.
    post:
      tags: [Financeiro]
      summary: Cria forma de pagamento.
      responses:
        '201':
          description: Criada.
  /plano-contas:
    get:
      tags: [Financeiro]
      summary: Lista plano de contas.
      responses:
        '200':
          description: Lista.
    post:
      tags: [Financeiro]
      summary: Cria plano de conta.
      responses:
        '201':
          description: Criado.
  /fluxo-caixa:
    get:
      tags: [Financeiro]
      summary: Lista lançamentos do fluxo de caixa.
      responses:
        '200':
          description: Lista paginada.
    post:
      tags: [Financeiro]
      summary: Cria lançamento no fluxo de caixa.
      responses:
        '201':
          description: Criado.
  /fluxo-caixa/resumo:
    get:
      tags: [Financeiro]
      summary: Retorna resumo de receitas, despesas e saldo.
      responses:
        '200':
          description: Resumo.
  /receber:
    get:
      tags: [Financeiro]
      summary: Lista contas a receber.
      responses:
        '200':
          description: Lista paginada.
    post:
      tags: [Financeiro]
      summary: Cria conta a receber.
      responses:
        '201':
          description: Criada.
  /nfce:
    get:
      tags: [Fiscal]
      summary: Lista NFCe.
      responses:
        '200':
          description: Lista paginada.
  /nfce/{id}:
    get:
      tags: [Fiscal]
      summary: Detalha NFCe.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: NFCe.
  /nfce/{id}/pdf:
    get:
      tags: [Fiscal]
      summary: Retorna DANFCE em PDF.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: PDF.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /nfce/{id}/xml:
    get:
      tags: [Fiscal]
      summary: Baixa XML da NFCe.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: XML.
  /nfce/cupons/{cupom}/enviar:
    post:
      tags: [Fiscal]
      summary: Envia cupom para emissão de NFCe.
      parameters:
        - in: path
          name: cupom
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Envio processado.
  /notas-fiscais:
    get:
      tags: [Fiscal]
      summary: Lista NFe emitidas.
      responses:
        '200':
          description: Lista paginada.
  /relatorios/vendas:
    get:
      tags: [Relatorios]
      summary: Relatório JSON de vendas por período.
      parameters:
        - in: query
          name: inicio
          required: true
          schema: { type: string, format: date }
        - in: query
          name: fim
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Relatório.
  /relatorios/nfe:
    get:
      tags: [Relatorios]
      summary: Relatório JSON de NFe por período.
      parameters:
        - in: query
          name: inicio
          required: true
          schema: { type: string, format: date }
        - in: query
          name: fim
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Relatório.
